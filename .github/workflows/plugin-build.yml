name: release

on:
  # A release for every push to main that changes the plugin - not for docs alone
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', '.gitignore', 'docs/**' ]
  pull_request:
  workflow_dispatch:

# Pushes and manual runs share one group, so two of them can never read the same "latest release"
# and both try to create the same tag. PRs get a group of their own - a PR run queued in the release
# group would cancel a pending release run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN defaults to read-only on repos created since 2023, so creating a release fails
    # with 403 unless this is granted explicitly.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # PanoramaManager comes from nuget.org by version. The toast API resolves from the copy
      # committed under lib/.
      - name: Build
        run: dotnet build AFKManager/AFKManager.csproj -c Release --nologo

      # The plugin folder as it sits under addons/counterstrikesharp/plugins/, plus the panorama files
      # for the workshop addon. No pdb, and never CounterStrikeSharp.API.dll - that belongs to the host.
      - name: Stage release layout
        run: |
          set -e
          mkdir -p out/AFKManager out/workshop/panorama/layout/custom_game out/workshop/panorama/styles/custom_game
          cp -R AFKManager/bin/Release/net10.0/. out/AFKManager/
          cp hud/panorama/layout/custom_game/*.xml out/workshop/panorama/layout/custom_game/
          cp hud/panorama/styles/custom_game/*.css out/workshop/panorama/styles/custom_game/
          find out -name '*.pdb' -delete
          find out -name 'CounterStrikeSharp.API.dll' -delete

      - name: Verify the layout
        run: |
          set -e
          test -f out/AFKManager/AFKManager.dll
          test -f out/AFKManager/AFKManager.deps.json
          # The HUD library loads from the plugin's own folder
          test -f out/AFKManager/PanoramaManager.dll
          test -f out/AFKManager/lang/en.json
          test -f out/workshop/panorama/layout/custom_game/afk_hud.xml
          test -f out/workshop/panorama/styles/custom_game/afk_hud.css
          test -f out/workshop/panorama/styles/custom_game/hud_shared.css

          # The toast API must resolve from addons/counterstrikesharp/shared/. A copy next to the
          # plugin gives it its own IToastApi type and the capability cast fails as if ToastService
          # were not installed.
          if find out/AFKManager -name 'PanoramaManager.Toasts.Api.dll' | grep -q .; then
            echo "::error::PanoramaManager.Toasts.Api.dll was copied into the plugin folder - check Private=\"false\" on the reference."
            exit 1
          fi

          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: AFKManager
          path: out/

      # Everything below only on main (push or manual run). PRs build and stop.
      - name: Work out the next version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Highest v<N> across releases and tags, compared as numbers (v10 beats v9). Other tags, like
          # the upstream v0.0.7 or 0.1.1, are ignored. run_number is not used because it counts PR runs too.
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          tags=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')
          highest=$(printf '%s\n%s\n' "$releases" "$tags" | { grep -E '^v[0-9]+$' || true; } | sed 's/^v//' | sort -n | tail -1)
          next=$(( ${highest:-0} + 1 ))

          previous=${highest:+v$highest}
          echo "previous: ${previous:-none}  next: v${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cd out && zip -qr "../AFKManager-${{ steps.version.outputs.tag }}.zip" . -x '*.DS_Store'

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            "AFKManager-$tag.zip" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes
